# Every book must rebuild from this colophon exactly as it is committed in the
# books repository: ./fgb check --all there, with this checkout as colophon/.
name: books

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: which books branch
        # a colophon change that needs the books changed with it is tested
        # against the books branch of the same name, if there is one
        id: books
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads https://github.com/freely-given-books/books.git "$branch" >/dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - name: books repository (${{ steps.books.outputs.ref }})
        uses: actions/checkout@v4
        with:
          repository: freely-given-books/books
          ref: ${{ steps.books.outputs.ref }}
          path: books
      - name: the Typst templates (their tags are the versions)
        run: |
          git -C books submodule update --init typst/fgbooks-typst
          git -C books/typst/fgbooks-typst fetch --tags --quiet
      - name: this colophon as colophon/
        uses: actions/checkout@v4
        with:
          path: books/colophon
      - uses: astral-sh/setup-uv@v6
      - name: ./fgb check --all
        # colophon's fgb.py through uv, as the books repository's ./fgb runs it
        working-directory: books
        env:
          FGB_LIBRARY: ${{ github.workspace }}/books
        run: uv run --locked --project colophon python colophon/fgb.py check --all
